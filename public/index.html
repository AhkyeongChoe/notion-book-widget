<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Notion Book Widget</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, "Apple SD Gothic Neo", sans-serif;
      background: transparent;
      padding: 12px;
    }

    .widget {
      max-width: 420px;
      margin: 0 auto;
      background: #f5f5f5;
      border-radius: 12px;
      padding: 10px;
    }

    .search-box {
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      border: 1px solid #e2e2e2;
      border-radius: 8px;
      font-size: 14px;
      background: #ffffff;
      box-sizing: border-box;
    }

    .search-box:focus {
      outline: none;
      border-color: #999;
    }

    #result {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .book-card {
      position: relative;
      display: flex;
      gap: 12px;
      padding: 10px;
      border: 1px solid #e2e2e2;
      border-radius: 8px;
      background: #ffffff;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .book-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      background: #f7f7f7;
    }

    .book-cover {
      width: 60px;
      height: 84px;
      flex-shrink: 0;
      background: #eee;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #999;
      overflow: hidden;
      text-align: center;
      padding: 4px;
    }

    .book-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .book-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
      flex: 1;
    }

    .book-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .book-meta {
      font-size: 12px;
      color: #777;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .saved-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      color: #2e7d32;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .book-card.saved .saved-overlay {
      opacity: 1;
    }

    .spinner {
      width: 20px;
      height: 20px;
      margin: 16px auto;
      border: 2px solid #d0d0d0;
      border-top-color: #555;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .message {
      font-size: 12px;
      color: #777;
      text-align: center;
      padding: 10px 4px;
    }

    small {
      display: block;
      margin-top: 10px;
      font-size: 11px;
      color: #777;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="widget">
    <input
      id="query"
      class="search-box"
      placeholder="Search books..."
      autocomplete="off"
    />

    <div id="result"></div>

    <small>🤍📖🤍</small>
  </div>

  <script>
    const input = document.getElementById("query");
    const results = document.getElementById("result");
    let searchTimer = null;
    let latestQuery = "";

    input.addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(search, 400);
    });

    function showLoading() {
      results.innerHTML = `<div class="spinner"></div>`;
    }

    function escapeHtml(str = "") {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function showMessage(text) {
      results.innerHTML = `<div class="message">${escapeHtml(text)}</div>`;
    }

    function formatDate(datetime = "") {
      if (!datetime) return "";
      const date = new Date(datetime);
      if (Number.isNaN(date.getTime())) return "";
      return date.toISOString().slice(0, 10);
    }

    async function search() {
      const q = input.value.trim();
      latestQuery = q;

      if (q.length < 2) {
        results.innerHTML = "";
        return;
      }

      showLoading();

      try {
        const res = await fetch(`/api/searchBooks?q=${encodeURIComponent(q)}`);
        const data = await res.json();

        if (latestQuery !== q) return;

        results.innerHTML = "";

        if (!res.ok) {
          console.error("searchBooks failed:", data);
          showMessage(data.error || "Search failed.");
          return;
        }

        if (!data.documents || data.documents.length === 0) {
          showMessage("No results found.");
          return;
        }

        data.documents.forEach(book => {
          const title = book.title || "Untitled";
          const authors = Array.isArray(book.authors)
            ? book.authors.join(", ")
            : "";
          const publisher = book.publisher || "";
          const publishedDate = formatDate(book.datetime);
          const thumbnail = book.thumbnail || "";
          const isbn = book.isbn || "";

          const imageHTML = thumbnail
            ? `<img
                src="${escapeHtml(thumbnail)}"
                referrerpolicy="no-referrer"
                onerror="this.style.display='none'; this.parentElement.innerHTML='No Image';"
              />`
            : `<span>No Image</span>`;

          const card = document.createElement("div");
          card.className = "book-card";

          card.innerHTML = `
            <div class="book-cover">
              ${imageHTML}
            </div>
            <div class="book-info">
              <div class="book-title">${escapeHtml(title)}</div>
              <div class="book-meta">${escapeHtml(authors)}</div>
              <div class="book-meta">${escapeHtml(publisher)}${publisher && publishedDate ? " · " : ""}${escapeHtml(publishedDate)}</div>
            </div>
            <div class="saved-overlay">✔ Saved</div>
          `;

          card.onclick = async () => {
            if (card.classList.contains("saved")) return;

            card.classList.add("saved");

            try {
              const saveRes = await fetch("/api/addBook", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  title,
                  authors,
                  publisher,
                  publishedDate,
                  thumbnail,
                  isbn
                })
              });

              const saveText = await saveRes.text().catch(() => "");

              if (!saveRes.ok) {
                console.error("addBook failed:", saveRes.status, saveText);
                card.classList.remove("saved");
                return;
              }

              setTimeout(() => {
                card.classList.remove("saved");
              }, 800);
            } catch (error) {
              console.error("addBook error:", error);
              card.classList.remove("saved");
            }
          };

          results.appendChild(card);
        });
      } catch (error) {
        console.error("search error:", error);
        if (latestQuery === q) {
          showMessage("An error occurred while searching.");
        }
      }
    }
  </script>
</body>
</html>
